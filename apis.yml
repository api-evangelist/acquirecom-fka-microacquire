name: Acquire.com (fka MicroAcquire)
description: 'Acquire.com (formerly MicroAcquire) is an online marketplace for buying
  and selling startups and online businesses. It connects vetted buyers with founders
  looking to sell, offering deal discovery, financial metrics, escrow and closing
  tooling, buyer memberships, and M&A education through the Acquire Academy. Founded
  by Andrew Gazdecki and backed by Bessemer Venture Partners, the platform operates
  as a self-serve acquisition marketplace (app.acquire.com) rather than a developer
  API provider. This profile tracks the company in the API Evangelist network; no
  public developer API, SDKs, or webhook surface is currently published.'
